<!doctype html>
<html lang="{{ site.lang | default: 'ja' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <div class="site-shell">
      <aside class="sidebar">
        <a class="site-title" href="{{ '/' | relative_url }}">raspi<br>camera</a>
        <p class="sidebar-label">DOCUMENTATION</p>
        <nav aria-label="ドキュメント">
          <a href="{{ '/' | relative_url }}">はじめに</a>
          <a href="{{ '/raspberry-pi-setup.html' | relative_url }}">セットアップ</a>
          <a href="{{ '/video-and-motion.html' | relative_url }}">動画・検知</a>
          <a href="{{ '/tailscale-setup.html' | relative_url }}">Tailscale</a>
          <a href="{{ '/development.html' | relative_url }}">開発</a>
          <a href="{{ '/github-pages.html' | relative_url }}">公開</a>
        </nav>
        <p class="sidebar-note">カメラ映像・写真・動画・認証情報は、このドキュメントサイトに公開しません。</p>
      </aside>
      <main class="content">
        {{ content }}
        <footer class="site-footer">
          <p>raspi-camera-web documentation</p>
        </footer>
      </main>
    </div>
  </body>
</html>
